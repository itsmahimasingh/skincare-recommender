<style>
@import url('https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap');
.welcome {max-width: 400px; margin: 10px auto 22px; border-radius: 36px; overflow: hidden;
          background: radial-gradient(circle at 50% 40%, #FDEFF2 0%, #FFFFFF 70%);
          box-shadow: 0 10px 30px rgba(216, 137, 152, 0.25); text-align: center; padding: 34px 16px 38px;}
.welcome svg {width: 100%; height: auto; display: block; overflow: visible;}
.welcome-title {font-family: 'Pinyon Script', cursive; color: #A8455F; font-size: 2.6rem; line-height: 1.15;
                margin-top: 6px;}
.welcome-label {font-family: sans-serif; color: #D88998; font-size: 0.75rem; letter-spacing: 3px; margin-top: 10px;}
/* petals grow out from the centre, one after another */
.petal {opacity: 0; transform-box: fill-box; transform-origin: 50% 100%;
        animation: bloom 1.1s cubic-bezier(.22, 1, .36, 1) forwards;}
.petal ellipse {mix-blend-mode: multiply; opacity: 0.38;}
.centre {opacity: 0; animation: fade 1s ease forwards 0.1s;}
.flower {transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite 2.6s;}
.ring {opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite;}
.welcome-title, .welcome-label {opacity: 0; animation: rise 1s ease forwards;}
.welcome-title {animation-delay: 2.0s;}
.welcome-label {animation-delay: 2.4s;}
div[data-testid="stButton"] {opacity: 0; animation: rise 0.8s ease forwards 2.9s;}
div[data-testid="stButton"] button {border-radius: 99px;}
@keyframes bloom {from {opacity: 0; transform: scale(0.15) rotate(-12deg);} to {opacity: 1; transform: scale(1) rotate(0);}}
@keyframes fade {to {opacity: 1;}}
@keyframes breathe {0%, 100% {transform: scale(1) rotate(0);} 50% {transform: scale(1.03) rotate(2deg);}}
@keyframes ripple {0% {opacity: 0; transform: scale(0.85);} 30% {opacity: 0.8;} 100% {opacity: 0; transform: scale(1.08);}}
@keyframes rise {from {opacity: 0; transform: translateY(14px);} to {opacity: 1; transform: translateY(0);}}
</style>
